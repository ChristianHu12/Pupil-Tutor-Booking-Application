<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Pupil View</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; line-height: 1.5; }
    input, select, button { padding: 5px 8px; margin: 3px 2px; }
    pre { background: #f5f5f5; padding: 12px; border: 1px solid #ccc; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  </style>
</head>
<body>
<div>
  <input type="password" id="tutor_key" placeholder="tutor api key"/>
  <button type="button" onclick="go_tutor();">tutor</button>
</div>
<hr/>
<div>
  <select id="day">
    <option value="monday">monday</option>
    <option value="tuesday">tuesday</option>
    <option value="wednesday">wednesday</option>
    <option value="thursday">thursday</option>
    <option value="friday">friday</option>
    <option value="saturday">saturday</option>
  </select>
  <button type="button" onclick="get_avail();">availability</button>
</div>
<hr/>
<div>
  <input type="text" id="pupil_key" value="PUPIL_KEY_1234567890_SECRET" placeholder="pupil key" size="30"/>
  <input type="text" id="matric" placeholder="matriculation"/>
  <input type="text" id="name" placeholder="pupil name"/>
  <input type="text" id="b_day" placeholder="day"/>
  <input type="text" id="time" placeholder="start time"/>
  <input type="text" id="inst" placeholder="instrument"/>
  <button type="button" onclick="book_it();">book</button>
  <button type="button" onclick="my_bookings();">my bookings</button>
</div>
<hr/>
<div>
  <input type="text" id="del_id" placeholder="booking id" size="36"/>
  <input type="text" id="del_matric" placeholder="matriculation"/>
  <button type="button" onclick="cancel_it();">cancel</button>
</div>
<hr/>
<pre id="output"></pre>
<script>
  const base = 'http://localhost:8080';
  const format_body = (t) => {
    if (!t) return '';
    try {
      return '\n' + JSON.stringify(JSON.parse(t), null, 2);
    } catch (_) {
      return ' ' + t;
    }
  };
  const show = (r, t) => {
    document.getElementById('output').textContent = r.status + format_body(t);
  };
  const p_hdr = (json) => {
    const k = document.getElementById('pupil_key').value.trim();
    const h = {};
    if (json) h['Content-Type'] = 'application/json';
    if (k) h['Authorization'] = 'Bearer ' + k;
    return h;
  };

  function go_tutor() {
    const k = document.getElementById('tutor_key').value.trim();
    fetch(base + '/bookings/check', { headers: { 'Authorization': 'Bearer ' + k } })
            .then(r => {
              if (r.status === 200) {
                sessionStorage.setItem('tKey', k);
                window.location.href = 'tutor.html';
              } else {
                r.text().then(t => show(r, t));
              }
            }).catch(e => document.getElementById('output').textContent = e);
  }

  function get_avail() {
    const d = document.getElementById('day').value;
    fetch(base + '/availability?day=' + encodeURIComponent(d))
            .then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').textContent = e);
  }

  function book_it() {
    const body = {
      pupilMatriculation: document.getElementById('matric').value.trim(),
      pupilName: document.getElementById('name').value.trim(),
      day: document.getElementById('b_day').value.trim(),
      startTime: document.getElementById('time').value.trim(),
      instrument: document.getElementById('inst').value.trim()
    };
    fetch(base + '/bookings', {
      method: 'POST',
      headers: p_hdr(true),
      body: JSON.stringify(body)
    }).then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').textContent = e);
  }

  function my_bookings() {
    const m = document.getElementById('matric').value.trim();
    fetch(base + '/bookings/pupil/' + encodeURIComponent(m), { headers: p_hdr(false) })
            .then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').textContent = e);
  }

  function cancel_it() {
    const id = document.getElementById('del_id').value.trim();
    const m = document.getElementById('del_matric').value.trim();
    fetch(base + '/bookings/' + encodeURIComponent(id) + '?matriculation=' + encodeURIComponent(m), {
      method: 'DELETE',
      headers: p_hdr(false)
    }).then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').textContent = e);
  }
</script>
</body>
</html>
