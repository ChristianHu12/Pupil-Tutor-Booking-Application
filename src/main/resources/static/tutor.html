<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Simple CRUD Client for the Welcome Service</title>
</head>
<body>
<div>
  <input type="text" id="guest_name" placeholder="guest name"/>
  <select id="guest_lang">
    <option value="en">en</option>
    <option value="de">de</option>
    <option value="fr">fr</option>
  </select>
  <button type="button" onclick="ding_request();">ding</button>
</div>
<hr/>
<div>
  <input type="text" id="lang" placeholder="language code"/>
  <input type="text" id="msg" placeholder="pupiltutor phrase"/>
  <button type="button" onclick="create_request();">create</button>
  <button type="button" onclick="update_request();">update</button>
  <button type="button" onclick="delete_request();">delete</button>
  <button type="button" onclick="read_all_request();">read all</button>
</div>
<hr/>
<div id="output">
</div>

<script>

  const base = 'http://localhost:8080/ding';
  const show = (r, t) => {
    document.getElementById('output').innerHTML = r.status + (t ? ' ' + t : '');
  };

  function ding_request() {
    let name = document.getElementById('guest_name').value;
    let lang = document.getElementById('guest_lang').value;
    let u = base + '/' + encodeURIComponent(lang) + (name ? '?name=' + encodeURIComponent(name) : '');
    fetch(u).then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').innerHTML = e);
  }

  function read_all_request() {
    fetch(base).then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').innerHTML = e);
  }

  function create_request() {
    let lang = document.getElementById('lang').value;
    let msg = document.getElementById('msg').value;
    fetch(base, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({lang: lang, msg: msg})
    }).then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').innerHTML = e);
  }

  function update_request() {
    let lang = document.getElementById('lang').value;
    let msg = document.getElementById('msg').value;
    fetch(base + '/' + encodeURIComponent(lang), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({lang: lang, msg: msg})
    }).then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').innerHTML = e);
  }

  function delete_request() {
    let lang = document.getElementById('lang').value;
    fetch(base + '/' + encodeURIComponent(lang), {
      method: 'DELETE'
    }).then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').innerHTML = e);
  }
</script>
</body>
</html>
