<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Tutor View</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; line-height: 1.5; }
    input, select, button { padding: 5px 8px; margin: 3px 2px; }
    pre { background: #f5f5f5; padding: 12px; border: 1px solid #ccc; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  </style>
</head>
<body>
<div>
  <button type="button" onclick="window.location.href='pupil.html';">pupil</button>
  <input type="password" id="t_key" placeholder="tutor api key" size="30"/>
</div>
<hr/>
<div>
  <input type="text" id="t_day" placeholder="day"/>
  <button type="button" onclick="tutor_bookings();">day bookings</button>
  <button type="button" onclick="check_allBookings();">check all bookings</button>
</div>
<hr/>
<div>
  <input type="text" id="blk_day" placeholder="day"/>
  <input type="text" id="blk_time" placeholder="start time"/>
  <button type="button" onclick="set_block('/availability/block');">block</button>
  <button type="button" onclick="set_block('/availability/unblock');">unblock</button>
</div>
<hr/>
<pre id="output"></pre>
<script>
  const base = 'http://localhost:8080';
  const format_body = (t) => {
    if (!t) return '';
    try {
      return '\n' + JSON.stringify(JSON.parse(t), null, 2);
    } catch (_) {
      return ' ' + t;
    }
  };
  const show = (r, t) => {
    document.getElementById('output').textContent = r.status + format_body(t);
  };
  document.getElementById('t_key').value = sessionStorage.getItem('tKey') || '';

  const t_hdr = () => {
    const k = document.getElementById('t_key').value.trim();
    return k ? { 'Authorization': 'Bearer ' + k } : {};
  };

  function tutor_bookings() {
    const d = document.getElementById('t_day').value.trim();
    fetch(base + '/bookings/tutor?day=' + encodeURIComponent(d), { headers: t_hdr() })
            .then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').textContent = e);
  }

  function check_allBookings() {
    fetch(base + '/bookings/check', { headers: t_hdr() })
            .then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').textContent = e);
  }

  function set_block(path) {
    const d = document.getElementById('blk_day').value.trim();
    const s = document.getElementById('blk_time').value.trim();
    const q = s ? '?day=' + encodeURIComponent(d) + '&startTime=' + encodeURIComponent(s) : '?day=' + encodeURIComponent(d);
    fetch(base + path + q, { method: 'POST', headers: t_hdr() })
            .then(r => r.text().then(t => show(r, t))).catch(e => document.getElementById('output').textContent = e);
  }
</script>
</body>
</html>
